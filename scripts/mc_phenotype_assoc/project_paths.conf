# Single source of truth for where the big files live.
#
# Sourced by mc_phenotype_assoc_common.sh and submit_assoc.sh, and parsed by
# check_label_availability.py (simple key=value, no expansion). It exists because
# the scratch path was previously hardcoded in three places, they drifted, and
# check_label_availability.py consequently looked under $HOME and reported "no
# directory" for every cell line whose labels were on scratch.
#
# scratch_proj_dir : project root holding results/labels/<cell>/... and the
#                    association outputs. The first entry that exists wins;
#                    if none do, the repository itself is used (laptop).
# Override at run time by exporting scratch_proj_dir or labels_base.

scratch_proj_dir=/scratch/users/gsantamaria/test_large_files/metabognn_dev

# Add further candidates below, one per line, most preferred first. Only paths
# that actually exist are considered, so listing a path for another machine is
# harmless.

# ---------------------------------------------------------------------------
# Python environment (read by python_env.sh)
#
# mamba_env_prefix : the micromamba environment holding numpy/scipy. Normally not
#                    needed - python_env.sh asks micromamba where the environment
#                    `metabolic_drug_repurposing` is, and falls back to the system
#                    python3 on a laptop that already has the dependencies. Set it
#                    only if micromamba is not on PATH inside batch jobs, which is
#                    the usual reason mc_phenotype_assoc.py fails with
#                    "No module named numpy" after Slurm grants the allocation.
#
# mamba_root_prefix : MAMBA_ROOT_PREFIX, i.e. where micromamba keeps `envs/`.
#                     Needed because the environment lives under a shared project
#                     directory rather than the default ~/micromamba, so without it
#                     micromamba reports no such environment. Repeatable, most
#                     preferred first; only directories that exist are tried, so a
#                     path belonging to another machine is harmless.
mamba_root_prefix=/work/projects/car_t_methylome/software/micromamba

# mamba_env_prefix  : the environment directory itself, if it is somewhere that
#                     <root>/envs/<name> does not cover. Rarely needed.
# mamba_env_prefix=/path/to/envs/metabolic_drug_repurposing
